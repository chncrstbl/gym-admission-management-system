name: Temporary npm audit remediation

on:
  push:
    branches:
      - feature/npm-audit-remediation
    paths:
      - '.github/workflows/npm-audit-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dependency remediation branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Apply compatible security updates and summarize advisories
        shell: bash
        run: |
          npm audit --json > /tmp/audit-before.json || true
          npm audit fix || true
          npm audit --json > /tmp/audit-after.json || true

          node <<'NODE'
          const fs = require('fs');
          for (const filename of ['/tmp/audit-before.json', '/tmp/audit-after.json']) {
            let audit = {};
            try { audit = JSON.parse(fs.readFileSync(filename, 'utf8')); } catch {}
            console.log(filename, JSON.stringify({
              metadata: audit.metadata?.vulnerabilities || {},
              advisories: Object.entries(audit.vulnerabilities || {}).map(([name, item]) => ({
                name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable
              }))
            }, null, 2));
          }
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "npm audit fix did not change package files."
          else
            git commit -m "fix: remediate npm dependency advisories"
            git push origin HEAD:feature/npm-audit-remediation
          fi
